<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <script>
        // Polyfill process and global for browser environments
        window.global = window;
        window.process = {
            env: {
                NODE_ENV: 'development',
            },
            version: '',
            versions: {},
            platform: 'browser'
        };
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>糖友導航 - 老友記糖尿病決策輔助</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;900&display=swap');

        :root {
            /* Healing palette: Gentle, Soft, Trustworthy */
            --brand-primary: #4A6E85;     /* Steady, muted blue */
            --brand-secondary: #7FA0B4;   /* Soft sky */
            --brand-accent: #E8DED2;      /* Warm beige */
            --bg-calm: #FBFBFA;           /* Off-white, soft background */
            --text-main: #2C3E50;         /* Grounded charcoal */
            --text-muted: #7F8C8D;        /* Gentle grey */
            --radius-soft: 1.75rem;
        }

        body {
            font-family: 'Noto Sans HK', sans-serif;
            background-color: var(--bg-calm);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .premium-card {
            background: white;
            border-radius: var(--radius-soft);
            border: 1px solid rgba(0, 0, 0, 0.03);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .premium-card:hover {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            transform: translateY(-2px);
        }

        .nav-blur {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* Large, readable targets */
        input, textarea, select, button {
            font-size: 1.125rem;
            border-radius: 1rem;
        }

        /* Looser spacing for accessibility */
        .spacy-container {
            padding: 2rem;
        }

        @keyframes soft-fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-soft {
            animation: soft-fade-in 0.8s ease-out forwards;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #DEDCDA;
            border-radius: 10px;
        }

        /* 超強大字模式：專為香港長者設計的智慧全局比例調整 */
        .large-font {
            letter-spacing: 0.04em !important;
            word-spacing: 0.05em !important;
            line-height: 1.7 !important;
        }
        .large-font .text-\[10px\],
        .large-font .text-\[9px\] {
            font-size: 14px !important;
            line-height: 1.4 !important;
        }
        .large-font .text-xs {
            font-size: 16px !important;
            line-height: 1.5 !important;
        }
        .large-font .text-sm {
            font-size: 18px !important;
            line-height: 1.6 !important;
            font-weight: 700 !important;
        }
        .large-font .text-base {
            font-size: 20px !important;
            line-height: 1.6 !important;
            font-weight: 700 !important;
        }
        .large-font .text-lg {
            font-size: 22px !important;
            line-height: 1.6 !important;
            font-weight: 800 !important;
        }
        .large-font .text-xl {
            font-size: 24px !important;
            line-height: 1.5 !important;
            font-weight: 900 !important;
        }
        .large-font .text-2xl {
            font-size: 26px !important;
            line-height: 1.4 !important;
            font-weight: 900 !important;
        }
        .large-font .text-3xl {
            font-size: 30px !important;
            line-height: 1.3 !important;
            font-weight: 900 !important;
        }
        .large-font .text-3\.5xl,
        .large-font .text-4xl,
        .large-font .text-5xl {
            font-size: 36px !important;
            line-height: 1.2 !important;
            font-weight: 900 !important;
        }

        /* 增加長者大字模式下的按鈕觸控區域與間距，防止誤觸 */
        .large-font button,
        .large-font input,
        .large-font select,
        .large-font textarea {
            min-height: 3.5rem !important; /* 不低於 56px */
            font-size: 18px !important;
        }
        .large-font select {
            padding-right: 2.5rem !important;
        }
    </style>

</head>
<body>
<div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
